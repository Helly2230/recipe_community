{% extends "recipes/base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-screen bg-gray-900 animate-fadeInUp">
    <div class="neumorphism p-10 w-full max-w-md">
        <h2 class="text-3xl font-bold text-white mb-8 text-center">Register</h2>
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label for="{{ form.username.id_for_label }}" class="block text-gray-300 mb-3 text-sm font-medium">{{ form.username.label }}</label>
                {{ form.username }}
            </div>
            <div>
                <label for="{{ form.email.id_for_label }}" class="block text-gray-300 mb-3 text-sm font-medium">{{ form.email.label }}</label>
                {{ form.email }}
            </div>
            <div>
                <label for="{{ form.password1.id_for_label }}" class="block text-gray-300 mb-3 text-sm font-medium">{{ form.password1.label }}</label>
                {{ form.password1 }}
            </div>
            <div>
                <label for="{{ form.password2.id_for_label }}" class="block text-gray-300 mb-3 text-sm font-medium">{{ form.password2.label }}</label>
                {{ form.password2 }}
            </div>
            <button type="submit" class="w-full neumorphism-btn text-white py-3 px-6">Register</button>
        </form>
    </div>
</div>
{% endblock %}
