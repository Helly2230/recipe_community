{% extends "recipes/base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-screen">
    <div class="neumorphism p-8 w-full max-w-md">
        <h2 class="text-2xl font-bold text-white mb-6 text-center">Delete Recipe</h2>
        <p class="text-gray-300 mb-8 text-center">Are you sure you want to delete "<strong class="text-white">{{ object.title }}</strong>"?</p>
        <div class="flex space-x-4">
            <a href="{% url 'recipe-detail' object.pk %}" class="flex-1 neumorphism-btn text-white py-3 text-center">Cancel</a>
            <form method="post" class="flex-1">
                {% csrf_token %}
                <button type="submit" class="neumorphism-btn text-white w-full py-3">Delete</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
