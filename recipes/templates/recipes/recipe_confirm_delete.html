{% extends "recipes/base.html" %}

{% block content %}
<h2>Delete Recipe</h2>
<p>Are you sure you want to delete "{{ object.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
    <a href="{% url 'recipe-detail' object.pk %}">Cancel</a>
</form>
{% endblock %}
