{% extends "recipes/base.html" %}

{% block content %}
<h2>Recipes</h2>
{% if user.is_authenticated %}
<a href="{% url 'recipe-create' %}">Add Recipe</a>
{% endif %}
{% for recipe in recipes %}
<div>
    <h3><a href="{% url 'recipe-detail' recipe.pk %}">{{ recipe.title }}</a></h3>
    <p>By {{ recipe.author }} on {{ recipe.created_at }}</p>
    {% if recipe.photo %}
    <img src="{{ recipe.photo.url }}" alt="{{ recipe.title }}" width="200">
    {% endif %}
</div>
{% endfor %}
{% endblock %}
