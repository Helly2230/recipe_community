{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Recipe Community</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'recipes/css/style.css' %}">
</head>
<body class="bg-gray-900 min-h-screen">
    <nav class="neumorphism-inset">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="{% url 'home' %}" class="text-xl font-bold text-white hover:text-gray-300 transition-colors">Recipe Community</a>
                </div>
                <div class="flex items-center space-x-4">
                    {% if user.is_authenticated %}
                        <a href="{% url 'profile' %}" class="text-gray-300 hover:text-white transition-colors">Profile</a>
                        <a href="{% url 'logout' %}" class="text-gray-300 hover:text-white transition-colors">Logout</a>
                    {% else %}
                        <a href="{% url 'login' %}" class="text-gray-300 hover:text-white transition-colors">Login</a>
                        <a href="{% url 'register' %}" class="text-gray-300 hover:text-white transition-colors">Register</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-8">
        {% if messages %}
            {% for message in messages %}
                <div class="neumorphism text-gray-200 px-4 py-3 mb-4">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
